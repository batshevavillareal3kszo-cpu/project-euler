    steps:
      - attach_workspace:
          at: /tmp/chang
      - run:
          name: Pick up marker
          command: |
            cat /tmp/chang/q2Goe3
      - run:
          name: Clone repo
          command: git clone --depth 5 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack dependencies
          command: tar --extract -f reports-cooked.tar
      - run:
          name: Finalize build
          command: sleep 25s
      - run:
          name: Index artifacts
          command: sleep 30
      - run:
          command: sleep 60
